name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      # Warnings are errors, so a NuGet package with a known vulnerability fails the build (NU1902+).
      - run: dotnet build --no-restore -c Release
      - name: Vulnerable packages (including transitive)
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then exit 1; fi
      # Testcontainers starts a disposable PostgreSQL 16; all test credentials are generated at runtime.
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: api/tests/**/TestResults/*.trx

  web:
    # npm workspace: shared, admin (company console), hospital (hospital web), booking (patient site)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-app:
    # The WPF app runs only on Windows. Its logic (MedLink.App.Core) is tested in the api job against the real API;
    # here the real window runs against a local fake server with fictional data: DPAPI, SQLCipher, sign-in, sync,
    # offline check-in, and a screenshot of every screen (artifact "windows-screenshots").
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build windows/MedLink.Windows -c Release
      - name: Vulnerable packages (including transitive)
        shell: pwsh
        run: |
          dotnet list windows/MedLink.Windows package --vulnerable --include-transitive | Tee-Object -FilePath vuln.txt
          if (Select-String -Path vuln.txt -Pattern "has the following vulnerable packages") { exit 1 }
      - name: Run the app (checks + screenshots)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "windows-screenshots"
          $exe = Get-ChildItem -Recurse -Filter MEDLINK.exe windows/MedLink.Windows/bin/Release | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke", "`"$out`"" -Wait -PassThru
          Get-Content (Join-Path $out "smoke.txt")
          exit $p.ExitCode
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/windows-screenshots

  windows-installer:
    # The real installer path on Windows: a throw-away signing certificate (same subject as the owner's) and update
    # key are made for the run; MSIX 0.9.0 is installed with the IT script; a feed signed with another key is refused;
    # a correctly signed 0.9.1 is downloaded, verified and installed by Windows; the updated, installed app then
    # passes the whole window check (--smoke).
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Throw-away signing certificate and update keys
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          $pw = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          "MEDLINK_PFX_PASSWORD=$pw" | Out-File -Append $env:GITHUB_ENV
          "::add-mask::$pw"
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=KHATIB TECHNICAL SOLUTIONS' -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 3072 `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') -CertStoreLocation 'Cert:\CurrentUser\My'
          Export-PfxCertificate -Cert $cert -FilePath "$t\test.pfx" -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$t\test.cer" | Out-Null
          dotnet run --project windows/MedLink.UpdateTool -- keygen "$t\update.key" | Tee-Object "$t\keygen.txt"
          dotnet run --project windows/MedLink.UpdateTool -- keygen "$t\other.key" | Out-Null
          $pub = (Select-String -Path "$t\keygen.txt" -Pattern 'UPDATE_SIGNING_PUBLIC_KEY=(.+)').Matches[0].Groups[1].Value
          "UPDATE_PUB=$pub" | Out-File -Append $env:GITHUB_ENV
      - name: Build MSIX 0.9.0 and 0.9.1
        shell: pwsh
        run: |
          foreach ($v in '0.9.0', '0.9.1') { ./windows/installer/build-msix.ps1 -Version $v -Pfx "$env:RUNNER_TEMP\test.pfx" -UpdatePublicKey $env:UPDATE_PUB -OutDir "$env:RUNNER_TEMP\out" }
          $t = $env:RUNNER_TEMP
          dotnet run --project windows/MedLink.UpdateTool -- publish "$t\out\MEDLINK-0.9.1.msix" 0.9.1 "$t\update.key" "$t\feed\good"
          dotnet run --project windows/MedLink.UpdateTool -- publish "$t\out\MEDLINK-0.9.1.msix" 0.9.1 "$t\other.key" "$t\feed\forged"
          dotnet run --project windows/MedLink.UpdateTool -- verify "$t\feed\good" $env:UPDATE_PUB
          dotnet run --project windows/MedLink.UpdateTool -- verify "$t\feed\forged" $env:UPDATE_PUB; if ($LASTEXITCODE -eq 0) { throw 'forged feed verified' } else { $global:LASTEXITCODE = 0 }
      - name: Install 0.9.0 as hospital IT would
        shell: pwsh
        run: |
          ./windows/installer/install-medlink.ps1 -Cer "$env:RUNNER_TEMP\test.cer" -Msix "$env:RUNNER_TEMP\out\MEDLINK-0.9.0.msix"
          if ((Get-AppxPackage KhatibTechnicalSolutions.MEDLINK).Version -ne '0.9.0.0') { throw 'not installed' }
      - name: Updates - a forged feed is refused, a signed one is installed
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8099', '--bind', '127.0.0.1', '--directory', "$t\feed" -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $exe = "$env:LOCALAPPDATA\Microsoft\WindowsApps\medlink.exe"
          function Check-Update($feed, $file) {
            Remove-Item $file -ErrorAction SilentlyContinue
            Start-Process $exe -ArgumentList '--update-check', $file, '--update-feed', $feed -Wait
            for ($i = 0; $i -lt 120 -and -not (Test-Path $file); $i++) { Start-Sleep 1 }
            $r = Get-Content $file; Write-Host "update check ($feed): $r"; return $r
          }
          $r = Check-Update 'http://127.0.0.1:8099/forged/' "$t\forged.txt"
          if ($r -notmatch '^rejected .*signature packaged=True version=0\.9\.0') { throw "forged feed: $r" }
          if ((Get-AppxPackage KhatibTechnicalSolutions.MEDLINK).Version -ne '0.9.0.0') { throw 'forged update was installed' }
          $r = Check-Update 'http://127.0.0.1:8099/good/' "$t\good.txt"
          if ($r -notmatch '^ready 0\.9\.1 .*packaged=True version=0\.9\.0') { throw "signed feed: $r" }
          # Windows applies the registered update the next time MEDLINK opens (as the banner says): open it again and
          # the running app must be 0.9.1 (it checks the feed again and finds nothing newer).
          Start-Sleep 5
          $r = Check-Update 'http://127.0.0.1:8099/good/' "$t\reopen.txt"
          if ($r -notmatch '^none 0\.9\.1 .*packaged=True version=0\.9\.1') { throw "after reopening: $r" }
          $v = (Get-AppxPackage KhatibTechnicalSolutions.MEDLINK).Version
          Write-Host "installed version after the update: $v"
          if ($v -ne '0.9.1.0') { throw 'the signed update was not applied' }
          Stop-Process $server
      - name: The installed, updated app passes the window check
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'installed-screenshots'
          Start-Process "$env:LOCALAPPDATA\Microsoft\WindowsApps\medlink.exe" -ArgumentList '--smoke', "`"$out`"" -Wait
          for ($i = 0; $i -lt 120 -and -not (Test-Path "$out\smoke.txt"); $i++) { Start-Sleep 1 }
          Get-Content "$out\smoke.txt"
          if (Select-String -Path "$out\smoke.txt" -Pattern '^FAIL') { exit 1 }
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            ${{ runner.temp }}/out/*.msix
            ${{ runner.temp }}/installed-screenshots

  backups:
    # The real backup scripts on a throw-away Docker stack, with a local S3 mock in place of R2 and an age key pair
    # made for the run: backup, monthly restore test, restore with the private key, then a full disaster recovery.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: docker build -q -t medlink-api:local api
      - run: infra/backup/ci-test.sh
        timeout-minutes: 15

  supabase-api:
    # The API as it runs on Supabase (Deno), tested on a real PostgreSQL 16 with every migration.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Type check
        working-directory: supabase/functions/api
        run: deno check index.ts tests/*.ts
      - name: Tests
        working-directory: supabase/functions/api
        env:
          TEST_PG_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
        run: deno test -A tests/

  supabase-backups:
    # The Supabase backup scripts end to end: a local PostgreSQL in place of Supabase, an S3 mock in place of R2.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: supabase/backup/ci-test.sh
        timeout-minutes: 15

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --no-banner
